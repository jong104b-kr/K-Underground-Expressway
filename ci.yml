name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: |
          pytest tests/ -v
          # torchmetrics 테스트 예시
          python -c "import torchmetrics; print('torchmetrics OK')"
      - name: Build Docker image
        run: |
          docker build -t \${{ github.repository }}:ci .
